name = "ip-sakti-backend-edge"
main = "main_edge.py"
compatibility_date = "2024-10-01"
compatibility_flags = [ "python_workers" ]

# 1. Cloudflare Workers AI Binding
[ai]
binding = "AI"

# 2. Cloudflare Vectorize Binding (Raw Numerical Embeddings Index)
[[vectorize]]
binding = "VECTORIZE_INDEX"
index_name = "ip-sakti-legal-embeddings"

# 3. Cloudflare D1 Database Binding (Structured Text, Citations & Logs)
[[d1_databases]]
binding = "DB"
database_name = "ip-sakti-db"
database_id = "2977e86c-96a6-4a7a-babe-8d61c744952b"

[triggers]
# Periodic Vector Knowledge Graph Self-Ingestion Cycle (Daily at 02:00 UTC)
crons = [ "0 2 * * *" ]

[vars]
ALLOWED_ORIGINS = "https://ayura.shreesabari5143.workers.dev,https://ayura-frontend.pages.dev,http://localhost:5173,http://localhost:3000"
AI_MODEL = "@cf/qwen/qwen2.5-7b-instruct"
DEFAULT_JURISDICTION = "India"
FALLBACK_CITATION_NOTICE = "I do not have enough verified material to provide an authoritative statutory citation."
