version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ipsakti-postgres
    restart: always
    environment:
      POSTGRES_DB: ipsakti
      POSTGRES_USER: ipsakti
      POSTGRES_PASSWORD: ipsakti_secure_2026
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

